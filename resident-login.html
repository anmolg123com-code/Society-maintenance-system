<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resident Login - Civiora</title>
    <link rel="stylesheet" href="css/resident-login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Background image can be added here if needed -->
    <div class="background-image" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;">
        <!-- <img src="assets/background.jpg" alt="Background" style="width: 100%; height: 100%; object-fit: cover;"> -->
    </div>
    
    <div class="login-container">
        <div class="login-form">
            <div class="logo">
                <i class="fas fa-home"></i>
                <h1>Civiora</h1>
            </div>
            <h2>Resident Login</h2>
            <p class="subtitle">Access your society services</p>
            <form id="ResidentForm">
                <div class="input-group">
                    <label for="residentId"><i class="fas fa-id-card"></i> Resident ID</label>
                    <input type="text" id="residentId" name="residentId" placeholder="Enter your Resident ID" required>
                </div>
                <div class="input-group">
                    <label for="residentPassword"><i class="fas fa-lock"></i> Password</label>
                    <input type="password" id="residentPassword" name="residentPassword" placeholder="Enter your password" required>
                </div>
                <div class="options">
                    <div class="remember-me">
                        <input type="checkbox" id="residentRemember">
                        <label for="residentRemember">Remember me</label>
                    </div>
                    <a href="#" class="forgot-password">Forgot Password?</a>
                </div>
                <button type="submit" class="login-btn">Login as Resident</button>
            </form>
            <div class="divider">
                <span>or continue with</span>
            </div>
            <div class="social-login">
                <button class="social-btn google">
                    <i class="fab fa-google"></i> Google
                </button>
                <button class="social-btn facebook">
                    <i class="fab fa-facebook-f"></i> Facebook
                </button>
            </div>
            <div class="switch-login">
                <p>Are you an admin? <a href="login.html">Login here</a></p>
                <p>Don't have an account? <a href="#">Sign up</a></p>
            </div>
        </div>
    </div>
    <script src="js/resident-login.js"></script>
</body>
</html>
